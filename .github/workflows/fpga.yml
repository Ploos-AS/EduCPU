name: FPGA

on:
  push:
    paths:
      - "fpga/**"
      - "docs/FPGA_M0.md"
      - ".github/workflows/fpga.yml"
  pull_request:
    paths:
      - "fpga/**"
      - "docs/FPGA_M0.md"
      - ".github/workflows/fpga.yml"

jobs:
  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run RTL smoke test
        working-directory: fpga/rtl
        run: make test
      - name: Check reference-model conformance vectors
        run: sh fpga/conformance/check_reference.sh
