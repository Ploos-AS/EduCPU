name: FPGA

on:
  push:
    paths:
      - "fpga/**"
      - "docs/FPGA_M0.md"
      - ".github/workflows/fpga.yml"
  pull_request:
    paths:
      - "fpga/**"
      - "docs/FPGA_M0.md"
      - ".github/workflows/fpga.yml"

jobs:
  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RTL and synthesis tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Run RTL smoke test
        working-directory: fpga/rtl
        run: make test
      - name: Run board-neutral Yosys/iCE40 synthesis
        working-directory: fpga/rtl
        run: make synth
      - name: Check reference-model conformance vectors
        run: sh fpga/conformance/check_reference.sh
      - name: Run RTL/reference differential conformance
        run: python3 fpga/conformance/run_differential.py
