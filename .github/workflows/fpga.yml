name: FPGA

on:
  push:
    paths:
      - "fpga/**"
      - "docs/FPGA_M0.md"
      - ".github/workflows/fpga.yml"
  pull_request:
    paths:
      - "fpga/**"
      - "docs/FPGA_M0.md"
      - ".github/workflows/fpga.yml"

jobs:
  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RTL and synthesis tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys nextpnr-ice40 fpga-icestorm
      - name: Run RTL smoke test
        working-directory: fpga/rtl
        run: make test
      - name: Run UPduino bring-up program simulation
        working-directory: fpga/rtl
        run: make bringup-test
      - name: Run loader hand-off simulation
        working-directory: fpga/rtl
        run: make loader-test
      - name: Run serial loader protocol simulation
        working-directory: fpga/rtl
        run: make serial-loader-test
      - name: Run UART TX waveform simulation
        working-directory: fpga/rtl
        run: make uart-tx-test
      - name: Run loader v1 status simulation
        working-directory: fpga/rtl
        run: make loader-status-test
      - name: Run serial loader v1 CRC simulation
        working-directory: fpga/rtl
        run: make serial-loader-v1-test
      - name: Run protocol v1 bidirectional UART end-to-end simulation
        working-directory: fpga/rtl
        run: make serial-v1-e2e-test
      - name: Run UART-to-CPU end-to-end simulation
        working-directory: fpga/rtl
        run: make serial-e2e-test
      - name: Run board-neutral Yosys/iCE40 synthesis
        working-directory: fpga/rtl
        run: make synth
      - name: Run iCE40UP5K core place-and-route qualification
        working-directory: fpga/rtl
        run: make up5k
      - name: Synthesize secondary iCEBreaker UP5K target
        working-directory: fpga/rtl
        run: make icebreaker
      - name: Run explicit SPRAM iCE40UP5K machine qualification
        working-directory: fpga/rtl
        run: make spram-up5k
      - name: Build UPduino v3.1 bitstream
        working-directory: fpga/rtl
        run: make upduino-v31
      - name: Upload UPduino v3.1 bitstream
        uses: actions/upload-artifact@v4
        with:
          name: educpu-upduino-v31-bitstream
          path: fpga/rtl/educpu_upduino_v31.bin
          if-no-files-found: error
      - name: Build UPduino serial-loader bitstream
        working-directory: fpga/rtl
        run: make upduino-v31-loader
      - name: Upload UPduino serial-loader bitstream
        uses: actions/upload-artifact@v4
        with:
          name: educpu-upduino-v31-loader-bitstream
          path: fpga/rtl/educpu_upduino_v31_loader.bin
          if-no-files-found: error
      - name: Build canonical UPduino protocol-v1 loader bitstream
        working-directory: fpga/rtl
        run: make upduino-v31-loader-v1
      - name: Upload canonical UPduino protocol-v1 loader bitstream
        uses: actions/upload-artifact@v4
        with:
          name: educpu-upduino-v31-loader-v1-bitstream
          path: fpga/rtl/educpu_upduino_v31_loader_v1.bin
          if-no-files-found: error
      - name: Check reference-model conformance vectors
        run: sh fpga/conformance/check_reference.sh
      - name: Run RTL/reference differential conformance
        run: python3 fpga/conformance/run_differential.py
